apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: llm-logger
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: api
        static_configs:
          - targets: ['llm-api:3001']
      - job_name: worker
        static_configs:
          - targets: ['llm-worker:3002']
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: llm-logger
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: llm-logger
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: llm-logger
data:
  llm-observability.json: |
    {
      "uid": "llm-observability",
      "title": "LLM Observability",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Inference Latency",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(llm_inference_latency_ms_bucket[5m])) by (le, provider, model))",
              "legendFormat": "{{provider}} / {{model}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Ingestion Throughput",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(llm_inference_requests_total[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Worker Errors",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(llm_worker_errors_total[5m]))",
              "legendFormat": "errors"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: llm-logger
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: ds
              mountPath: /etc/grafana/provisioning/datasources
            - name: dash
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: ds
          configMap:
            name: grafana-datasource
        - name: dash
          configMap:
            name: grafana-dashboard