apiVersion: v1
kind: Service
metadata:
  name: llm-worker
  namespace: llm-logger
spec:
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: llm-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-worker
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-worker
  template:
    metadata:
      labels:
        app: llm-worker
    spec:
      containers:
        - name: worker
          image: llm-worker:latest
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: REDIS_URL
            - name: WORKER_PORT
              valueFrom:
                configMapKeyRef:
                  name: llm-config
                  key: WORKER_PORT