apiVersion: v1
kind: Service
metadata:
  name: llm-web
  namespace: llm-logger
spec:
  ports:
    - port: 80
      targetPort: 5173
  selector:
    app: llm-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-web
  namespace: llm-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-web
  template:
    metadata:
      labels:
        app: llm-web
    spec:
      containers:
        - name: web
          image: llm-web:latest
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_BASE_URL
              value: http://llm-api:3001