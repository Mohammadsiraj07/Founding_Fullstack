apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
  namespace: llm-logger
data:
  API_PORT: "3001"
  WEB_PORT: "5173"
  WORKER_PORT: "3002"
  INGEST_URL: http://llm-api:3001
  DEFAULT_MODEL: gemini-2.0-flash
  REDIS_URL: redis://llm-redis:6379
  DATABASE_URL: postgresql://postgres:postgres@llm-postgres:5432/llm_logs